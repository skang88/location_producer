services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: rescuer-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - rescuer-net
      - npm-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: rescuer-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - rescuer-net

  mqtt_bridge:
    build:
      context: ./services/mqtt_bridge
    container_name: rescuer-mqtt-bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
      - kafka
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: "sensors/+/data"
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "raw-sensor-data"
    networks:
      - rescuer-net

  location_engine:
    build:
      context: ./services/location_engine
    container_name: rescuer-location-engine
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: "kafka:9092"
      INPUT_TOPIC: "raw-sensor-data"
      OUTPUT_TOPIC: "rescuer-positions"
    networks:
      - rescuer-net

  dashboard:
    build:
      context: ./services/dashboard
    container_name: rescuer-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: "kafka:9092"
      POSITIONS_TOPIC: "rescuer-positions"
      RAW_SENSOR_TOPIC: "raw-sensor-data"
    networks:
      - rescuer-net
      - npm-net

networks:
  rescuer-net:
    driver: bridge
  npm-net:
    external: true
    name: nginx-proxy-manager_default

volumes:
  mosquitto_data:
  kafka_data:
