# ------------------------------------------------------------
# 1. NPM Admin Console (npm.gnfire.opik.net)
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name npm.gnfire.opik.net;

    access_log /data/logs/npm_access.log standard;
    error_log /data/logs/npm_error.log warn;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        proxy_pass http://127.0.0.1:81;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Scheme $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name npm.gnfire.opik.net;

    ssl_certificate /data/custom_ssl/selfsigned.crt;
    ssl_certificate_key /data/custom_ssl/selfsigned.key;

    access_log /data/logs/npm_access.log standard;
    error_log /data/logs/npm_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:81;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Scheme $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }
}

# ------------------------------------------------------------
# 2. Rescuer Monitoring Dashboard (dashboard.gnfire.opik.net / gnfire.opik.net)
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.gnfire.opik.net gnfire.opik.net;

    access_log /data/logs/dashboard_access.log standard;
    error_log /data/logs/dashboard_error.log warn;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        proxy_pass http://rescuer-dashboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Scheme $scheme;

        # WebSocket & SSE support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Path-based fallback for MQTT over WebSocket
    location /mqtt {
        proxy_pass http://rescuer-mosquitto:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.gnfire.opik.net gnfire.opik.net;

    ssl_certificate /data/custom_ssl/selfsigned.crt;
    ssl_certificate_key /data/custom_ssl/selfsigned.key;

    access_log /data/logs/dashboard_ssl_access.log standard;
    error_log /data/logs/dashboard_ssl_error.log warn;

    location / {
        proxy_pass http://rescuer-dashboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Scheme $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /mqtt {
        proxy_pass http://rescuer-mosquitto:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

