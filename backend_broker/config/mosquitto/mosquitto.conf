# Standard MQTT TCP Listener (Internal)
listener 1883 0.0.0.0
allow_anonymous true

# MQTT over WebSocket Listener (For Nginx Reverse Proxy / Port 443 WSS)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
